stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  script:
    - apk add --no-cache curl jq
    - |
      # Read pinned tacplus version from tacplus.yaml (required).
      # Format: "MAJOR.MINOR.PATCH" where PATCH is a number or "x" (resolve latest).
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      PATCH="$(echo "$TACPLUS_VER" | cut -d. -f3)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      if [ "$PATCH" = "x" ]; then
        # Use CAVALIER_CI_TOKEN (group access token) for registry JWT auth.
        REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
        TOKEN=$(curl -sf \
          "https://gitlab.com/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
          -u "oauth2:${CAVALIER_CI_TOKEN}" | jq -r '.token // empty')
        if [ -z "$TOKEN" ]; then
          echo "ERROR: failed to obtain registry JWT token for tacplus ${MAJOR}.${MINOR}" >&2; exit 1
        fi
        PATCH=$(curl -sf -H "Authorization: Bearer $TOKEN" \
          "https://${CI_REGISTRY}/v2/${REPO}/tags/list" \
          | jq -r '.tags[]' | grep -xE '[0-9]+' | sort -n | tail -1)
        if [ -z "$PATCH" ]; then
          echo "ERROR: no patch tags found for tacplus ${MAJOR}.${MINOR} in registry" >&2; exit 1
        fi
        echo "Resolved tacplus ${MAJOR}.${MINOR}.x -> ${MAJOR}.${MINOR}.${PATCH}"
      fi
      IMAGE="${CI_REGISTRY}/${REPO}:${PATCH}"
      echo "TACPLUS_IMAGE=${IMAGE}" > tacplus.env
      echo "Using tacplus image: ${IMAGE}"
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  TACPLUS_PROJECT_PATH: "secondstarcavalier/schematic/tacplus"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    MINOR="$(echo "$DOTPART" | cut -d. -f2)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  cache:
    - key: tacplus
      paths:
        - tacplus/
    - key: maven
      paths:
        - .m2/repository
  before_script:
    - *setup-netrc
    - mkdir -p ~/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)" > ~/.docker/config.json
    - tacplus build --skip-post
  script:
    - mvn -pl server -am -Dtacplus.skip=true -Dmaven.test.skip=true package
  artifacts:
    paths:
      - server/target/event-bus.jar
    expire_in: 1 hour

build-arm64:
  extends: .build-arch
  tags:
    - schematic-aarch64

.package-arch:
  stage: package
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    # Merge group credentials (DOCKER_AUTH_CONFIG, cross-project read) with the CI
    # job token (push access) into ~/.docker/config.json so docker build can pull
    # schematic base images and docker push can write to the project registry.
    - mkdir -p ~/.docker
    - '[ -n "$DOCKER_AUTH_CONFIG" ] && echo "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json || true'
    - docker pull "${TACPLUS_IMAGE}"
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY_IMAGE"
    - |
      cid=$(docker create --platform "linux/${ARCH}" "${TACPLUS_IMAGE}")
      docker cp "${cid}:/usr/local/bin/launcher" "launcher-linux-${ARCH}"
      docker rm "${cid}"
      chmod +x "launcher-linux-${ARCH}"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/eventbus-${MAJOR}-${MINOR}"
      docker build --platform "linux/${ARCH}" \
        -t "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        .
      docker push "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}"

package-arm64:
  extends: .package-arch
  tags:
    - schematic-aarch64
  needs:
    - build-arm64
    - compute-image
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  needs:
    - package-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    # Merge group credentials (DOCKER_AUTH_CONFIG, cross-project read) with the CI
    # job token (push access) into ~/.docker/config.json so docker build can pull
    # schematic base images and docker push can write to the project registry.
    - mkdir -p ~/.docker
    - '[ -n "$DOCKER_AUTH_CONFIG" ] && echo "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json || true'
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY_IMAGE"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/eventbus-${MAJOR}-${MINOR}"
      docker pull --platform linux/arm64 "${IMAGE}:${CI_COMMIT_TAG}-arm64"
      docker tag "${IMAGE}:${CI_COMMIT_TAG}-arm64" "${IMAGE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE}:${CI_COMMIT_TAG}"
# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - apk add --no-cache curl jq
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      PATCH="$(echo "$TACPLUS_VER" | cut -d. -f3)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      if [ "$PATCH" = "x" ]; then
        REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
        TOKEN=$(curl -sf \
          "https://gitlab.com/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
          -u "oauth2:${CAVALIER_CI_TOKEN}" | jq -r '.token // empty')
        if [ -z "$TOKEN" ]; then
          echo "ERROR: failed to obtain registry JWT token for tacplus ${MAJOR}.${MINOR}" >&2; exit 1
        fi
        PATCH=$(curl -sf -H "Authorization: Bearer $TOKEN" \
          "https://${CI_REGISTRY}/v2/${REPO}/tags/list" \
          | jq -r '.tags[]' | grep -xE '[0-9]+' | sort -n | tail -1)
        if [ -z "$PATCH" ]; then
          echo "ERROR: no patch tags found for tacplus ${MAJOR}.${MINOR} in registry" >&2; exit 1
        fi
      fi
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/${REPO}:${PATCH}" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
